<section>
  <h1>Nova Nota Fiscal</h1>

  <form [formGroup]="itemForm" (ngSubmit)="addItem()">
    <mat-form-field appearance="outline">
      <mat-label>Produto</mat-label>
      <mat-select formControlName="productId">
        @for (product of products; track product.id) {
          <mat-option [value]="product.id">
            {{ product.code }} — {{ product.description }} (saldo {{ product.balance }})
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Quantidade</mat-label>
      <input matInput type="number" formControlName="quantity">
    </mat-form-field>

    <button mat-stroked-button type="submit">Adicionar item</button>
  </form>

  <table mat-table [dataSource]="items">
    <ng-container matColumnDef="productCode">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let item">{{ item.productCode }}</td>
    </ng-container>
    <ng-container matColumnDef="productDescription">
      <th mat-header-cell *matHeaderCellDef>Descrição</th>
      <td mat-cell *matCellDef="let item">{{ item.productDescription }}</td>
    </ng-container>
    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef>Qtd</th>
      <td mat-cell *matCellDef="let item">{{ item.quantity }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let item; let index = index">
        <button mat-button type="button" (click)="removeItem(index)">Remover</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  <p class="actions">
    <button mat-flat-button color="primary" type="button" [disabled]="saving" (click)="save()">
      Criar nota
    </button>
  </p>
</section>
